name: Build Windows EXE

on:
  push:
    tags:
      - "v*"          # Trigger: git tag v1.0.0 && git push --tags
  workflow_dispatch:  # Manuell aus GitHub UI auslösbar

permissions:
  contents: write   # Nötig für Release-Erstellung

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: EXE bauen
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "FreeFlowWindows" `
            --hidden-import "pystray._win32" `
            --hidden-import "win32gui" `
            --hidden-import "win32api" `
            --hidden-import "win32con" `
            --hidden-import "sounddevice" `
            freeflow_windows.py

      - name: Release erstellen & EXE hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: "FreeFlow Windows ${{ github.ref_name }}"
          body: |
            ## 🎙️ FreeFlow Windows ${{ github.ref_name }}

            ### Installation
            1. `FreeFlowWindows.exe` herunterladen
            2. Doppelklicken — kein Python, keine Installation nötig
            3. Kostenlosen Groq API-Key unter [console.groq.com](https://console.groq.com) holen
            4. Taste wählen, loslegen ✅

            ### Erste Schritte
            - Taste **halten** → sprechen → **loslassen** → Text erscheint
            - Standard-Taste: Rechte Strg (in Einstellungen änderbar)
            - Tray-Icon in der Taskleiste → Einstellungen / Beenden
          files: dist/FreeFlowWindows.exe
          draft: false
          prerelease: false
